name: Reconstruir VPA de FIIs CVM
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fii-vpa-rebuild.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fii-vpa-rebuild
  cancel-in-progress: false
jobs:
  vpa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Testar conciliação antes da ingestão
        id: tests
        continue-on-error: true
        run: |
          python3 -m unittest discover -s tests -p 'test_cvm_fii.py' -v 2>&1 | tee /tmp/fii-tests.log
          exit ${PIPESTATUS[0]}
      - name: Reconstruir métricas usando CVM oficial 2026
        id: cvm
        if: ${{ steps.tests.outcome == 'success' }}
        continue-on-error: true
        env:
          CVM_FII_YEAR: '2026'
        run: |
          python3 scripts/refresh_cvm_fii.py 2>&1 | tee /tmp/fii-ingestion.log
          exit ${PIPESTATUS[0]}
      - name: Reconciliar os tickers com os novos VPA
        id: tickers
        if: ${{ steps.cvm.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 scripts/map_cvm_fii_tickers.py 2>&1 | tee /tmp/fii-tickers.log
          exit ${PIPESTATUS[0]}
      - name: Gerar diagnóstico de cobertura
        if: ${{ always() }}
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          CVM_OUTCOME: ${{ steps.cvm.outcome }}
          TICKERS_OUTCOME: ${{ steps.tickers.outcome }}
        run: |
          python3 - <<'PY'
          import datetime,json,os,pathlib
          root=pathlib.Path('public/data')
          status={'schemaVersion':1,'dataType':'fii-vpa-rebuild-status',
                  'runId':os.getenv('GITHUB_RUN_ID'),
                  'checkedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
                  'tests':os.getenv('TEST_OUTCOME'),
                  'cvm':os.getenv('CVM_OUTCOME'),
                  'tickers':os.getenv('TICKERS_OUTCOME')}
          for name,file,key in [('metrics','cvm-fii-metrics.json','metrics'),('mapped','cvm-fii-by-ticker.json','records')]:
              path=root/file
              if not path.exists():continue
              data=json.loads(path.read_text(encoding='utf-8'))
              rows=data.get(key,[])
              status[name]={'records':len(rows),'withUnits':sum(x.get('units',0)>0 for x in rows),
                            'withHolders':sum(x.get('holders') is not None for x in rows),
                            'withValidatedNav':sum(x.get('navValidated') is True and x.get('navCalculated',0)>0 for x in rows)}
          for name in ('tests','ingestion','tickers'):
              log=pathlib.Path('/tmp/fii-'+name+'.log')
              if log.exists():
                  lines=log.read_text(errors='replace').splitlines()
                  status[name+'LogTail']=lines[-12:]
          root.mkdir(parents=True,exist_ok=True)
          (root/'cvm-fii-vpa-status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n')
          print(status)
          PY
      - name: Publicar snapshots e diagnóstico
        if: ${{ always() }}
        run: |
          mkdir -p docs/data
          cp public/data/cvm-fii-vpa-status.json docs/data/cvm-fii-vpa-status.json
          git add public/data/cvm-fii-vpa-status.json docs/data/cvm-fii-vpa-status.json
          if [ -s public/data/cvm-fii-metrics.json ]; then
            cp public/data/cvm-fii-metrics.json docs/data/cvm-fii-metrics.json
            git add public/data/cvm-fii-metrics.json docs/data/cvm-fii-metrics.json
          fi
          if [ -s public/data/cvm-fii-by-ticker.json ]; then
            cp public/data/cvm-fii-by-ticker.json docs/data/cvm-fii-by-ticker.json
            git add public/data/cvm-fii-by-ticker.json docs/data/cvm-fii-by-ticker.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="radar-eod-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "data: reconstrói VPA conciliado de FIIs CVM"
          git push
      - name: Reportar falha de reconstrução
        if: ${{ steps.tests.outcome != 'success' || steps.cvm.outcome != 'success' || steps.tickers.outcome != 'success' }}
        run: exit 1
