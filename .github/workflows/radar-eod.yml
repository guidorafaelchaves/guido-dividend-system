name: Radar - CVM e B3 D-1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-eod.yml'
      - 'scripts/refresh_cvm_fii.py'
      - 'scripts/refresh-cvm-catalog.mjs'
      - 'scripts/refresh-radar-eod.mjs'
      - 'scripts/report-b3-eod-status.mjs'
      - 'tests/test_cvm_fii.py'
      - 'scripts/map_cvm_fii_tickers.py'
      - 'tests/test_fii_ticker_mapping.py'
      - 'scripts/report-fii-mapping-status.py'
  schedule:
    # 08:00 de Brasilia (UTC-3), de segunda a sexta, equivale a 11:00 UTC.
    # Dados B3, se disponíveis, são sempre do pregão anterior.
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-eod
  cancel-in-progress: false
jobs:
  fechamento:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar coletores antes da sincronização
        run: node --test tests/daily-ingestion.test.mjs
      - name: Testar parser financeiro CVM com ZIP sintético
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Atualizar catálogo oficial CVM
        run: node scripts/refresh-cvm-catalog.mjs
      - name: Extrair métricas contábeis de FIIs do informe CVM 2026
        id: fii
        continue-on-error: true
        env:
          CVM_FII_YEAR: '2026'
        run: python3 scripts/refresh_cvm_fii.py
      - name: Cruzar CNPJ e ticker com último informe CVM válido
        id: mapping
        if: ${{ always() && (steps.fii.outcome == 'success' || steps.fii.outcome == 'failure') }}
        continue-on-error: true
        run: |
          if [ ! -s public/data/cvm-fii-metrics.json ]; then
            echo "::error::Não existe arquivo contábil CVM validado."
            exit 1
          fi
          python3 scripts/map_cvm_fii_tickers.py
      - name: Avisar se o mapeamento não pôde ser publicado
        if: ${{ always() && steps.mapping.outcome == 'failure' }}
        run: echo "::warning::Vínculo ticker/CNPJ não publicado; confira fonte cadastral e validações."
      - name: Sinalizar incompatibilidade do esquema de FII
        if: ${{ steps.fii.outcome == 'failure' }}
        run: echo "::warning::Extração de FIIs falhou. Nenhum indicador novo será publicado; consulte o log e verifique o esquema CSV."
      - name: Publicar diagnóstico da associação CNPJ e ticker
        if: ${{ always() && steps.mapping.outcome != '' }}
        env:
          FII_CVM_OUTCOME: ${{ steps.fii.outcome }}
          FII_MAPPING_OUTCOME: ${{ steps.mapping.outcome }}
        run: python3 scripts/report-fii-mapping-status.py
      - name: Verificar disponibilidade da fonte B3 autorizada
        id: feed
        env:
          RADAR_EOD_FEED_URL: ${{ secrets.RADAR_EOD_FEED_URL }}
          RADAR_EOD_PUBLICATION_ALLOWED: ${{ vars.RADAR_EOD_PUBLICATION_ALLOWED }}
          RADAR_EOD_USAGE_RIGHTS_CONFIRMED: ${{ vars.RADAR_EOD_USAGE_RIGHTS_CONFIRMED }}
        run: |
          if [ -n "$RADAR_EOD_FEED_URL" ] && [ "$RADAR_EOD_PUBLICATION_ALLOWED" = "true" ] && [ "$RADAR_EOD_USAGE_RIGHTS_CONFIRMED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "B3 bloqueada: falta feed ou confirmação de direitos de distribuição/uso em produto; mantendo último fechamento."
          fi
      - name: Consultar B3 D-1 somente se houver feed e licença
        id: b3
        if: ${{ steps.feed.outputs.enabled == 'true' }}
        continue-on-error: true
        env:
          RADAR_EOD_FEED_URL: ${{ secrets.RADAR_EOD_FEED_URL }}
          RADAR_EOD_FEED_TOKEN: ${{ secrets.RADAR_EOD_FEED_TOKEN }}
          RADAR_EOD_PUBLICATION_ALLOWED: ${{ vars.RADAR_EOD_PUBLICATION_ALLOWED }}
          RADAR_EOD_USAGE_RIGHTS_CONFIRMED: ${{ vars.RADAR_EOD_USAGE_RIGHTS_CONFIRMED }}
        run: node scripts/refresh-radar-eod.mjs
      - name: Registrar estado da fonte B3 e cobertura FIIs
        if: ${{ always() && steps.feed.outcome != '' }}
        env:
          B3_FEED_ENABLED: ${{ steps.feed.outputs.enabled }}
          B3_STEP_OUTCOME: ${{ steps.b3.outcome }}
          B3_RUN_ID: ${{ github.run_id }}
        run: node scripts/report-b3-eod-status.mjs
      - name: Avisar quando fonte B3 configurada falhar
        if: ${{ steps.feed.outputs.enabled == 'true' && steps.b3.outcome == 'failure' }}
        run: echo "::warning::Feed B3 falhou; CVM será publicada sem atualizar cotações."

      - name: Espelhar dados no diretório do GitHub Pages
        run: |
          mkdir -p docs/data
          cp public/data/cvm-catalog.json docs/data/cvm-catalog.json
          if [ -f public/data/fii-mapping-status.json ]; then cp public/data/fii-mapping-status.json docs/data/fii-mapping-status.json; fi
          if [ -f public/data/cvm-fii-metrics.json ]; then cp public/data/cvm-fii-metrics.json docs/data/cvm-fii-metrics.json; fi
          if [ -f public/data/cvm-fii-by-ticker.json ]; then cp public/data/cvm-fii-by-ticker.json docs/data/cvm-fii-by-ticker.json; fi
          if [ -f public/data/radar-eod.json ]; then cp public/data/radar-eod.json docs/data/radar-eod.json; fi
          if [ -f public/data/b3-eod-status.json ]; then cp public/data/b3-eod-status.json docs/data/b3-eod-status.json; fi
      - name: Publicar somente arquivos alterados
        run: |
          git add public/data/cvm-catalog.json docs/data/cvm-catalog.json
          if [ -f public/data/fii-mapping-status.json ]; then git add public/data/fii-mapping-status.json docs/data/fii-mapping-status.json; fi
          if [ -f public/data/cvm-fii-metrics.json ]; then git add public/data/cvm-fii-metrics.json docs/data/cvm-fii-metrics.json; fi
          if [ -f public/data/cvm-fii-by-ticker.json ]; then git add public/data/cvm-fii-by-ticker.json docs/data/cvm-fii-by-ticker.json; fi
          if [ -f public/data/radar-eod.json ]; then git add public/data/radar-eod.json docs/data/radar-eod.json; fi
          if [ -f public/data/b3-eod-status.json ]; then git add public/data/b3-eod-status.json docs/data/b3-eod-status.json; fi
          if git diff --cached --quiet; then
            echo "Sem dados novos."
            exit 0
          fi
          git -c user.name="radar-eod-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "data: sincroniza Radar CVM e B3 D-1"
          git push
