name: Radar - CVM e B3 D-1
on:
  schedule:
    # 08:00 de Brasilia (UTC-3), de segunda a sexta, equivale a 11:00 UTC.
    # Dados B3, se disponíveis, são sempre do pregão anterior.
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-eod
  cancel-in-progress: false
jobs:
  fechamento:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Atualizar catálogo oficial CVM
        run: node scripts/refresh-cvm-catalog.mjs
      - name: Verificar disponibilidade da fonte B3 autorizada
        id: feed
        env:
          RADAR_EOD_FEED_URL: ${{ secrets.RADAR_EOD_FEED_URL }}
          RADAR_EOD_PUBLICATION_ALLOWED: ${{ vars.RADAR_EOD_PUBLICATION_ALLOWED }}
        run: |
          if [ -n "$RADAR_EOD_FEED_URL" ] && [ "$RADAR_EOD_PUBLICATION_ALLOWED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "B3 não configurada; mantendo último fechamento sem alteração."
          fi
      - name: Consultar B3 D-1 somente se houver feed e licença
        if: ${{ steps.feed.outputs.enabled == 'true' }}
        env:
          RADAR_EOD_FEED_URL: ${{ secrets.RADAR_EOD_FEED_URL }}
          RADAR_EOD_FEED_TOKEN: ${{ secrets.RADAR_EOD_FEED_TOKEN }}
          RADAR_EOD_PUBLICATION_ALLOWED: ${{ vars.RADAR_EOD_PUBLICATION_ALLOWED }}
        run: node scripts/refresh-radar-eod.mjs
      - name: Espelhar dados no diretório do GitHub Pages
        run: |
          mkdir -p docs/data
          cp public/data/cvm-catalog.json docs/data/cvm-catalog.json
          if [ -f public/data/radar-eod.json ]; then cp public/data/radar-eod.json docs/data/radar-eod.json; fi
      - name: Publicar somente arquivos alterados
        run: |
          git add public/data/cvm-catalog.json docs/data/cvm-catalog.json
          if [ -f public/data/radar-eod.json ]; then git add public/data/radar-eod.json docs/data/radar-eod.json; fi
          if git diff --cached --quiet; then
            echo "Sem dados novos."
            exit 0
          fi
          git -c user.name="radar-eod-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "data: sincroniza Radar CVM e B3 D-1"
          git push
